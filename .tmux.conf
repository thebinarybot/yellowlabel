# AIWeek tmux config - mouse navigation and clipboard.
#
# Sourced by scripts/herder-up so it survives tearing the session down and
# bringing it back up. To apply it to a session that is already running:
#   tmux source-file /mnt/x/Code/Projects/AIWeek/.tmux.conf

# --- mouse -------------------------------------------------------------
# Click a pane to focus it, drag a border to resize, wheel to scroll, click
# the status bar to switch windows.
set -g mouse on

# --- clipboard ---------------------------------------------------------
# clip.exe is the clipboard path that works here. xclip is installed but
# unusable: WSLg's X display is not reachable from this environment, so
# `xclip -selection clipboard` dies with "Can't open display: :0".
set -g copy-command 'clip.exe'

# Also emit OSC52, which Windows Terminal honours. Harmless alongside
# copy-command - same text, two routes - and it keeps copy working if the
# session is ever driven over SSH where clip.exe does not exist.
set -g set-clipboard on

# Drag-select then release copies straight to the Windows clipboard and drops
# out of copy mode. Bound for both key tables so it works whichever mode-keys
# is in effect.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Double-click a word, triple-click a line - copy without leaving copy mode,
# so the selection stays visible.
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear

bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear

# Middle-click pastes.
bind -n MouseDown2Pane paste-buffer -p

# Wheel scroll enters copy mode and scrolls the history rather than sending
# arrow keys to the shell.
bind -n WheelUpPane if-shell -Ft= '#{mouse_any_flag}' 'send-keys -M' \
  'if-shell -Ft= "#{pane_in_mode}" "send-keys -M" "copy-mode -e; send-keys -M"'

# --- quality of life ---------------------------------------------------
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on

# Pane borders carry the agent slug, which is the key binding a pane to an
# agent - keep it visible.
set -g pane-border-status top
set -g pane-border-format ' #{pane_title} '
